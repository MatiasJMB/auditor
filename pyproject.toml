[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor"
version = "0.1.0"
description = "CLI defensiva para auditar endpoints publicos, exposicion de informacion y scrapeabilidad."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
auditor = "auditor.cli:main"

[tool.setuptools.packages.find]
include = ["auditor*"]

